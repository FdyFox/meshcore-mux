# Tests every change and publishes multi-arch container images to GHCR.
#
#   push to main        -> ghcr.io/fdyfox/meshcore-mux:test and :sha-<commit>
#   published release   -> :<version>, :<major>.<minor>, :latest (no latest for pre-releases)
#   pull request        -> tests and image build only, nothing is published
#
# Releases must be tagged v<Version> (for example v0.5.0), matching Version in
# internal/mux/config.go and a "## <Version>" section in CHANGELOG.md.
name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  # Superseded main/PR builds are cancelled; a release build always completes.
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  GO_VERSION: "1.27.x" # keep in sync with the golang image in the Dockerfile
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run 'make fmt'. Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=3 ./...

      - name: Check release version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/mux/config.go)"
          if [ "$tag" != "$code" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Version \"$code\" in internal/mux/config.go"
            exit 1
          fi
          if ! grep -qx "## $code" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## $code'"
            exit 1
          fi

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine image name and version
        id: vars
        run: |
          # GHCR requires lowercase repository names.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meshcore-mux" >> "$GITHUB_OUTPUT"
          base="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/mux/config.go)"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Test images identify the exact commit in --version output.
            version="${base}-test.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=test,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'release' }}
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          EXPECTED: meshcore-mux ${{ steps.vars.outputs.version }}
        run: |
          actual="$(docker run --rm "$REF" --version)"
          echo "$actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Expected '$EXPECTED', got '$actual'"
            exit 1
          fi
          docker run --rm "$REF" --help > /dev/null 2>&1

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
